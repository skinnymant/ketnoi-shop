services:
  postgres:
    image: postgres:16
    container_name: ketnoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ketnoi
      POSTGRES_PASSWORD: ketnoi_dev_2026
      POSTGRES_DB: ketnoi_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ketnoi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: ketnoi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ketnoi
      MINIO_ROOT_PASSWORD: ketnoi_dev_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: